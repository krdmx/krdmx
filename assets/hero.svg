<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Maxim Krendel — Full-Stack Engineer</title>
  <desc id="desc">A graphite and green technical banner with data-flow lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C0B"/>
      <stop offset="0.55" stop-color="#101816"/>
      <stop offset="1" stop-color="#07110D"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CF7B4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7CF7B4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7CF7B4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
