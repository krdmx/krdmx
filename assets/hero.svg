  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="94" fill="#7CF7B4" font-size="18" font-weight="700" letter-spacing="5">FULL-STACK ENGINEER</text>
