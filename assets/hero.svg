    <text x="72" y="224" fill="#B5C9BE" font-size="22" letter-spacing="1.2">Web · Data · ML · Cybersecurity</text>
    <text x="72" y="294" fill="#7CF7B4" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">building reliable systems from interface to infrastructure_</text>
